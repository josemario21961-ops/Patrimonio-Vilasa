<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Patrimônio e Almoxarifado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="min-h-screen flex flex-col">
        <!-- Cabeçalho com o menu unificado -->
        <header class="bg-blue-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Gestão de Ativos & Canteiros</h1>
                <nav class="space-x-4">
                    <a href="index.html" class="underline font-semibold">Inventário</a>
                    <a href="cadastros.html" class="hover:underline">Cadastros</a>
                    <a href="romaneio.html" class="hover:underline">Novo Romaneio</a>
                    <a href="relatorio.html" class="hover:underline">Relatório Semanal (PDF)</a>
                </nav>
            </div>
        </header>

        <!-- Conteúdo Principal -->
        <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-gray-800">Consulta de Patrimônio e Estoque</h2>
                <div class="flex gap-2 w-full md:w-auto">
                    <!-- Barra de Busca -->
                    <input type="text" id="inputBusca" placeholder="Buscar por patrimônio, descrição..." class="border rounded-md px-3 py-2 text-sm w-full md:w-64" onkeyup="filtrarDados()">
                    <button onclick="carregarDados()" class="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 text-sm whitespace-nowrap">Atualizar</button>
                </div>
            </div>

            <!-- Tabela de Dados -->
            <div class="bg-white shadow-md rounded-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Patrimônio / TAG</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Descrição</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Modelo / Fabricante</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Localização Atual</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-patrimonios" class="divide-y divide-gray-200 text-sm text-gray-700">
                        <tr>
                            <td colspan="5" class="px-6 py-4 text-center text-gray-500">Carregando dados do Supabase...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://odwctwqdwrtavsamyeam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kd2N0d3Fkd3J0YXZzYW15ZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODE1MzQsImV4cCI6MjEwODM1NzUzNH0.JG4-XhewNCOFWkvxGuXwa3LDJx_KLROSmUIy0-O0FLE';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let listaGlobalPatrimonios = [];

        async function carregarDados() {
            const tbody = document.getElementById('tabela-patrimonios');
            tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Buscando informações...</td></tr>`;

            const { data, error } = await supabaseClient
                .from('patrimonios')
                .select(`
                    numero_patrimonio,
                    serie_tag,
                    status,
                    catalogo_itens (descricao, modelo, fabricante),
                    locais (nome, tipo)
                `);

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Erro ao carregar: ${error.message}</td></tr>`;
                return;
            }

            listaGlobalPatrimonios = data || [];
            exibirTabela(listaGlobalPatrimonios);
        }

        function exibirTabela(dados) {
            const tbody = document.getElementById('tabela-patrimonios');
            if (dados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Nenhum item encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            dados.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 font-mono font-bold">${item.numero_patrimonio || 'S/N'}</td>
                    <td class="px-6 py-4">${item.catalogo_itens?.descricao || '-'}</td>
                    <td class="px-6 py-4">${item.catalogo_itens?.modelo || ''} / ${item.catalogo_itens?.fabricante || ''}</td>
                    <td class="px-6 py-4 font-semibold text-blue-800">${item.locais?.nome || 'Não definido'} (${item.locais?.tipo || ''})</td>
                    <td class="px-6 py-4"><span class="px-2 py-1 text-xs rounded bg-gray-200">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarDados() {
            const termo = document.getElementById('inputBusca').value.toLowerCase();
            const filtrados = listaGlobalPatrimonios.filter(item => {
                const pat = (item.numero_patrimonio || '').toLowerCase();
                const desc = (item.catalogo_itens?.descricao || '').toLowerCase();
                const local = (item.locais?.nome || '').toLowerCase();
                return pat.includes(termo) || desc.includes(termo) || local.includes(termo);
            });
            exibirTabela(filtrados);
        }

        carregarDados();
    </script>
</body>
</html>
