<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Semanal - Almoxarifado Central</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-blue-900 text-white shadow-md print:hidden">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">Gestão de Ativos & Canteiros</h1>
            <nav class="space-x-4">
                <a href="index.html" class="hover:underline">Inventário</a>
                <a href="cadastros.html" class="hover:underline">Cadastros</a>
                <a href="romaneio.html" class="hover:underline">Novo Romaneio</a>
                <a href="relatorio.html" class="underline font-semibold">Relatório Semanal (PDF)</a>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 bg-white my-6 shadow-md rounded-lg">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">Relatório Semanal - Almoxarifado Central</h2>
                <p class="text-sm text-gray-500" id="data-atual"></p>
            </div>
            <button onclick="window.print()" class="bg-green-600 text-white px-4 py-2 rounded shadow hover:bg-green-700 print:hidden font-bold">Imprimir / Salvar PDF</button>
        </div>

        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Patrimônio / TAG</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Descrição</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Modelo / Fabricante</th>
                    <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                </tr>
            </thead>
            <tbody id="tabela-relatorio" class="divide-y divide-gray-200 text-sm text-gray-700">
                <tr>
                    <td colspan="4" class="px-4 py-4 text-center text-gray-500">Carregando itens da Central...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script>
        const SUPABASE_URL = 'https://odwctwqdwrtavsamyeam.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kd2N0d3Fkd3J0YXZzYW15ZWFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3ODE1MzQsImV4cCI6MjEwODM1NzUzNH0.JG4-XhewNCOFWkvxGuXwa3LDJx_KLROSmUIy0-O0FLE';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('data-atual').innerText = 'Emitido em: ' + new Date().toLocaleDateString('pt-BR');

        async function carregarRelatorio() {
            const tbody = document.getElementById('tabela-relatorio');

            // Buscar locais que são do tipo 'CENTRAL'
            const { data: locaisCentral } = await supabaseClient.from('locais').select('id').eq('tipo', 'CENTRAL');
            if (!locaisCentral || locaisCentral.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Nenhum local do tipo CENTRAL cadastrado.</td></tr>`;
                return;
            }
            const centralIds = locaisCentral.map(l => l.id);

            // Buscar patrimônios que estão na central
            const { data, error } = await supabaseClient
                .from('patrimonios')
                .select(`
                    numero_patrimonio,
                    status,
                    catalogo_itens (descricao, modelo, fabricante),
                    locais (nome)
                `)
                .in('local_atual_id', centralIds);

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-red-500">Erro: ${error.message}</td></tr>`;
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-4 py-4 text-center text-gray-500">Nenhum item encontrado no Almoxarifado Central no momento.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-2 font-mono font-bold">${item.numero_patrimonio || 'S/N'}</td>
                    <td class="px-4 py-2">${item.catalogo_itens?.descricao || '-'}</td>
                    <td class="px-4 py-2">${item.catalogo_itens?.modelo || ''} / ${item.catalogo_itens?.fabricante || ''}</td>
                    <td class="px-4 py-2"><span class="px-2 py-1 text-xs rounded bg-gray-200">${item.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        carregarRelatorio();
    </script>
</body>
</html>
